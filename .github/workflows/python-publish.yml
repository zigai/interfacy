name: Upload Python Package
on:
    release:
        types: [published]
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install uv
              uses: astral-sh/setup-uv@v7
            - name: Set up Python
              run: uv python install 3.10 3.14
            - name: Build and verify distributions
              run: |
                  uv build
                  INTERFACY_TEST_ARTIFACTS=1 uv run --python 3.14 --group test pytest tests/packaging -ra
            - name: Publish distributions
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.TOKEN }}
              run: uv run --with twine twine upload dist/*
