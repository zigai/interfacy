name: Lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --python 3.12

      - name: Check formatting with Ruff
        run: uv run --python 3.12 ruff format --check .

      - name: Run Ruff lint
        run: uv run --python 3.12 ruff check .

      - name: Run tests with coverage
        run: |
          uv run --python 3.12 coverage run -m pytest
          uv run --python 3.12 coverage report

      - name: Run Pyrefly
        run: uv run --python 3.12 pyrefly check --min-severity warn

      - name: Run codespell
        run: uv run --python 3.12 codespell

      - name: Verify Rattle consumer startup
        run: uv run --python 3.12 rattle --help
