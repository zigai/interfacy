name: Lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install "$(cat .python-version)"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting with Ruff
        run: uv run --group dev ruff format --check .

      - name: Run Ruff lint
        run: uv run --group dev ruff check .

      - name: Run tests with coverage
        run: |
          uv run --group dev coverage run -m pytest
          uv run --group dev coverage report

      - name: Run Pyrefly
        run: uv run --group dev pyrefly check --min-severity warn

      - name: Run codespell
        run: uv run --group dev codespell

      - name: Run Rattle lint
        run: uv run --group dev rattle check .
